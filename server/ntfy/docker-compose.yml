# 布布时光机 · 运维告警（自托管 ntfy）
# 只通知维护者备份/磁盘/服务/死信状态；不发送家庭记录正文。
#
# 部署：
#   cd server/ntfy && docker compose up -d
# 维护者订阅：在自己的手机添加服务器并订阅 bubu-ops。
#
# 安全：仅 Tailscale/受控反代可达；deny-all + 账号授权，话题名不是安全边界。
services:
  ntfy:
    image: binwiederhier/ntfy:v2.26.3@sha256:081b53dbb20674fcfe05fdb4eb8af9036a2645ef979543d16f7f80803af467b1
    container_name: bubu-ntfy
    command:
      - serve
    environment:
      - NTFY_BASE_URL=${NTFY_BASE_URL:-http://127.0.0.1:8095}
      - NTFY_LISTEN_HTTP=:8095
      - NTFY_BEHIND_PROXY=true
      # iOS 即时通知只向 ntfy.sh 转发 poll id 与话题 URL 哈希，不转发告警正文。
      - NTFY_UPSTREAM_BASE_URL=https://ntfy.sh
      - NTFY_ENABLE_LOGIN=true
      - NTFY_AUTH_DEFAULT_ACCESS=deny-all   # 默认拒绝，仅授权账号可发布/订阅
      - NTFY_AUTH_FILE=/var/lib/ntfy/user.db
      - NTFY_CACHE_FILE=/var/lib/ntfy/cache.db
    volumes:
      - ./data:/var/lib/ntfy
    ports:
      - "${NTFY_BIND_ADDRESS:-127.0.0.1}:8095:8095"
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:8095/v1/health -O - | grep -q healthy || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
