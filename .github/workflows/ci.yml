# BubuTimeMachine CI：iOS 构建+测试、AI 服务端测试
# 注意：iOS 工程 deploymentTarget 为 iOS 26，需要带 Xcode 26 的 macos-26 镜像；
# 若仓库所在账号暂无该 runner 镜像，可临时把 ios job 的 runs-on 调整为可用版本并 pin Xcode。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  harmony-policy:
    name: HarmonyOS repository gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reject signing material and stale parity metadata
        run: bash harmony/scripts/check-repository-hygiene.sh
      - name: Test pure HarmonyOS sync contracts
        run: node --test harmony/tests/*.test.mjs

  ios:
    name: iOS build & test (Xcode 26)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Reject duplicate source copies
        run: bash scripts/check-duplicate-source-files.sh

      - name: Select latest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          data = json.load(sys.stdin)
          devices = [d for devs in data['devices'].values() for d in devs if 'iPhone' in d['name']]
          print(devices[-1]['udid'] if devices else '')")
          if [ -z "$UDID" ]; then echo '没有可用 iPhone 模拟器'; exit 1; fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild -project BubuTimeMachine.xcodeproj \
            -scheme BubuTimeMachine \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            clean test | tail -120

  server:
    name: AI server tests (Python 3.9)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install deps
        working-directory: server/ai
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        working-directory: server/ai
        # `python -m` 会把当前服务目录加入模块搜索路径；直接调用 pytest 的
        # console script 在 GitHub Python 3.9 环境下无法 import movie_render。
        run: python -m pytest tests -q
