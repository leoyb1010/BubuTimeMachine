# BubuTimeMachine CI：iOS 构建+测试、AI 服务端测试
# 注意：iOS 工程 deploymentTarget 为 iOS 26，需要带 Xcode 26 的 macos-26 镜像；
# 若仓库所在账号暂无该 runner 镜像，可临时把 ios job 的 runs-on 调整为可用版本并 pin Xcode。
name: CI

on:
  push:
    branches: [main, audit/five-round-product-20261004, audit/three-round-safety-20261001]
  pull_request:

# Test-only workflow: no deployment, production credentials or write-capable token.
permissions:
  contents: read

jobs:
  harmony-policy:
    name: HarmonyOS repository gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Reject signing material and stale parity metadata
        run: bash harmony/scripts/check-repository-hygiene.sh
      - name: Test pure HarmonyOS sync contracts
        run: node --test harmony/tests/*.test.mjs

  ios:
    name: iOS build & test (Xcode 26, ${{ matrix.device }})
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      # Each simulator gets its own runner and full time budget. An iPhone failure
      # must not cancel iPad evidence or leave two simulators competing for memory.
      fail-fast: false
      matrix:
        device: [iPhone, iPad]
    steps:
      - name: Start bounded validation clock
        timeout-minutes: 1
        run: echo "BUBU_CI_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        timeout-minutes: 2

      - name: Reject duplicate source copies
        timeout-minutes: 1
        run: bash scripts/check-duplicate-source-files.sh

      - name: Select latest Xcode 26
        timeout-minutes: 1
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version

      - name: Install xcodegen
        timeout-minutes: 5
        run: brew install xcodegen ffmpeg

      - name: Generate project
        timeout-minutes: 1
        run: xcodegen generate

      - name: Use synthetic migration fixtures
        timeout-minutes: 1
        run: |
          python3 - <<'PYTHON'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          path = Path("BubuTimeMachine.xcodeproj/xcshareddata/xcschemes/BubuTimeMachine.xcscheme")
          tree = ET.parse(path)
          action = tree.getroot().find("TestAction")
          variables = action.find("EnvironmentVariables")
          if variables is None:
              variables = ET.SubElement(action, "EnvironmentVariables")
          ET.SubElement(variables, "EnvironmentVariable", {
              "key": "BUBU_SYNTHETIC_MIGRATION_FIXTURE", "value": "1", "isEnabled": "YES"})
          tree.write(path, encoding="utf-8", xml_declaration=True)
          PYTHON

      - name: Pick isolated simulator
        timeout-minutes: 2
        id: sim
        env:
          BUBU_CI_DEVICE: ${{ matrix.device }}
        run: |
          SIMULATOR=$(xcrun simctl list devices available -j | python3 -c '
          import json,os,sys
          kind = os.environ["BUBU_CI_DEVICE"]
          data = json.load(sys.stdin)
          devices = [d for devs in data["devices"].values() for d in devs if kind in d["name"]]
          print(devices[-1]["udid"] if devices else "")')
          if [ -z "$SIMULATOR" ]; then echo "No available $BUBU_CI_DEVICE simulator"; exit 1; fi
          echo "device=$SIMULATOR" >> "$GITHUB_OUTPUT"

      - name: Clean build for testing
        timeout-minutes: 8
        run: |
          set -o pipefail
          xcodebuild -project BubuTimeMachine.xcodeproj \
            BUBU_DEFAULT_BASE_URL=https://bubu-test.invalid \
            BUBU_DEFAULT_AI_BASE_URL=https://bubu-test.invalid \
            -scheme BubuTimeMachine \
            -parallel-testing-enabled NO \
            -destination "id=${{ steps.sim.outputs.device }}" \
            clean build-for-testing 2>&1 | tee /tmp/build.log

      - name: Unit tests (iPhone)
        timeout-minutes: 8
        if: matrix.device == 'iPhone'
        run: |
          set -o pipefail
          xcodebuild -project BubuTimeMachine.xcodeproj \
            BUBU_DEFAULT_BASE_URL=https://bubu-test.invalid \
            BUBU_DEFAULT_AI_BASE_URL=https://bubu-test.invalid \
            -scheme BubuTimeMachine \
            -parallel-testing-enabled NO \
            -destination "id=${{ steps.sim.outputs.device }}" \
            -skip-testing:BubuTimeMachineUITests \
            test-without-building 2>&1 | tee /tmp/unit.log

      - name: 零警告门禁
        timeout-minutes: 1
        run: |
          if grep -E "^/Users/runner/work/.*/(BubuTimeMachine|BubuWatch|BubuWidgets|WatchShared)[^:]*:[0-9]+:[0-9]+: warning:" /tmp/build.log | sort -u > /tmp/warnings.txt && [ -s /tmp/warnings.txt ]; then
            echo "::error::本仓源码出现编译警告，验收标准是零 warning："
            cat /tmp/warnings.txt
            exit 1
          fi
          echo "零警告 ✅"

      - name: Focused natural capture failure and retry journey
        timeout-minutes: 8
        run: |
          set -o pipefail
          xcodebuild -project BubuTimeMachine.xcodeproj \
            BUBU_DEFAULT_BASE_URL=https://bubu-test.invalid \
            BUBU_DEFAULT_AI_BASE_URL=https://bubu-test.invalid \
            -scheme BubuTimeMachine \
            -parallel-testing-enabled NO \
            -destination "id=${{ steps.sim.outputs.device }}" \
            -only-testing:BubuTimeMachineUITests/BubuTimeMachineUITests/testNaturalCaptureCancelThenSaveReturnsToTimeline \
            test-without-building 2>&1 | tee /tmp/ui-focused.log

      - name: Prepare synthetic PhotosPicker assets
        timeout-minutes: 10
        run: bash scripts/prepare-school-picker-fixtures.sh "${{ steps.sim.outputs.device }}"

      - name: Reserve failure evidence time
        id: budget
        timeout-minutes: 1
        run: |
          python3 - <<'PYTHON'
          import math, os, time
          elapsed = math.ceil((time.time() - int(os.environ["BUBU_CI_STARTED_AT"])) / 60)
          # Two minutes cover job setup/rounding; six cover export and upload.
          minutes = min(36, 60 - 2 - 6 - elapsed)
          if minutes < 1:
              raise SystemExit("Validation budget exhausted before UI; preserving earlier evidence")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"minutes={minutes}\n")
          print(f"UI has {minutes} minutes; diagnostic time remains reserved")
          PYTHON

      - name: UI 回归 (${{ matrix.device }})
        id: ui
        # Leave time for evidence export even when a simulator stalls.
        timeout-minutes: ${{ fromJSON(steps.budget.outputs.minutes) }}
        run: |
          set -o pipefail
          xcodebuild -project BubuTimeMachine.xcodeproj \
            BUBU_DEFAULT_BASE_URL=https://bubu-test.invalid \
            BUBU_DEFAULT_AI_BASE_URL=https://bubu-test.invalid \
            -scheme BubuTimeMachine \
            -parallel-testing-enabled NO \
            -destination "id=${{ steps.sim.outputs.device }}" \
            -only-testing:BubuTimeMachineUITests \
            test-without-building 2>&1 | tee /tmp/ui-first.log \
          || {
            echo "had_retry=true" >> "$GITHUB_OUTPUT"
            echo "UI 回归第一次失败，保留首次日志并按原有策略重试一次"
            xcodebuild -project BubuTimeMachine.xcodeproj \
              BUBU_DEFAULT_BASE_URL=https://bubu-test.invalid \
              BUBU_DEFAULT_AI_BASE_URL=https://bubu-test.invalid \
              -scheme BubuTimeMachine \
              -parallel-testing-enabled NO \
              -destination "id=${{ steps.sim.outputs.device }}" \
              -only-testing:BubuTimeMachineUITests \
              test-without-building 2>&1 | tee /tmp/ui-retry.log
          }

      - name: Preserve synthetic simulator evidence
        if: ${{ always() }}
        timeout-minutes: 4
        continue-on-error: true
        run: |
          mkdir -p /tmp/bubu-ci-diagnostics
          cp /tmp/build.log /tmp/unit.log /tmp/ui-first.log /tmp/ui-retry.log /tmp/ui-focused.log /tmp/bubu-ci-diagnostics/ 2>/dev/null || true
          python3 - <<'PYTHON'
          from pathlib import Path
          import subprocess
          root = Path.home() / "Library/Developer/Xcode/DerivedData"
          export = ["xcrun", "xcresulttool", "export", "attachments"]
          # Successful product journeys are evidence too; export their screenshots.
          for result in root.glob("*/Logs/Test/*.xcresult"):
              try:
                  subprocess.run(export + ["--path", str(result),
                                  "--output-path", str(Path("/tmp/bubu-ci-diagnostics") / result.stem)],
                                 check=False, timeout=45)
              except subprocess.TimeoutExpired:
                  print("Attachment export timed out:", result.name)
          PYTHON
          for log in /tmp/build.log /tmp/unit.log /tmp/ui-first.log /tmp/ui-retry.log /tmp/ui-focused.log; do
            if [ -f "$log" ]; then
              grep -E "error:|XCTAssert|Failing tests|Test Case .* failed|PhotosPicker failure" "$log" | tail -60 || true
            fi
          done

      - name: Upload synthetic simulator evidence
        timeout-minutes: 2
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-${{ matrix.device }}-evidence-${{ github.sha }}
          # Keep screenshots, accessibility text and logs readable without large recordings.
          path: |
            /tmp/bubu-ci-diagnostics/**/*.png
            /tmp/bubu-ci-diagnostics/**/*.jpg
            /tmp/bubu-ci-diagnostics/**/*.jpeg
            /tmp/bubu-ci-diagnostics/**/*.txt
            /tmp/bubu-ci-diagnostics/**/*.json
            /tmp/bubu-ci-diagnostics/*.log
          retention-days: 3
          if-no-files-found: warn

  server:
    name: AI server tests (Python 3.9)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: Install deps
        working-directory: server/ai
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        working-directory: server/ai
        # `python -m` 会把当前服务目录加入模块搜索路径；直接调用 pytest 的
        # console script 在 GitHub Python 3.9 环境下无法 import movie_render。
        run: python -m pytest tests -q

      - name: PocketBase migration and isolation integration tests
        # 与当前生产版本一致，独立临时数据库验证真实规则，不读取家庭数据。
        run: |
          curl -fsSL --retry 3 https://github.com/pocketbase/pocketbase/releases/download/v0.39.2/pocketbase_0.39.2_linux_amd64.zip -o /tmp/pocketbase.zip
          echo '054cdf8c52712c4fcab1c515f0e4d9cc0e31d4f4f3bd81d8455b663178e2f146  /tmp/pocketbase.zip' | sha256sum -c -
          unzip -q /tmp/pocketbase.zip -d /tmp/bubu-pocketbase
          POCKETBASE_BIN=/tmp/bubu-pocketbase/pocketbase python -m unittest discover -s server/pocketbase/tests -v
