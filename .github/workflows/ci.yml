# BubuTimeMachine CI：iOS 构建+测试、AI 服务端测试
# 注意：iOS 工程 deploymentTarget 为 iOS 26，需要带 Xcode 26 的 macos-26 镜像；
# 若仓库所在账号暂无该 runner 镜像，可临时把 ios job 的 runs-on 调整为可用版本并 pin Xcode。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  harmony-policy:
    name: HarmonyOS repository gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Reject signing material and stale parity metadata
        run: bash harmony/scripts/check-repository-hygiene.sh
      - name: Test pure HarmonyOS sync contracts
        run: node --test harmony/tests/*.test.mjs

  ios:
    name: iOS build & test (Xcode 26)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Reject duplicate source copies
        run: bash scripts/check-duplicate-source-files.sh

      - name: Select latest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Pick simulators
        id: sim
        run: |
          pick() {
            xcrun simctl list devices available -j | python3 -c "
          import json,sys
          kind = sys.argv[1]
          data = json.load(sys.stdin)
          devices = [d for devs in data['devices'].values() for d in devs if kind in d['name']]
          print(devices[-1]['udid'] if devices else '')" "$1"
          }
          IPHONE=$(pick iPhone)
          if [ -z "$IPHONE" ]; then echo '没有可用 iPhone 模拟器'; exit 1; fi
          echo "iphone=$IPHONE" >> "$GITHUB_OUTPUT"
          # iPad 缺失不算失败：iPad 回归会被跳过并在日志里说明，而不是让整条 CI 红掉。
          IPAD=$(pick iPad)
          echo "ipad=$IPAD" >> "$GITHUB_OUTPUT"

      - name: Build & test (iPhone)
        run: |
          set -o pipefail
          xcodebuild -project BubuTimeMachine.xcodeproj \
            -scheme BubuTimeMachine \
            -destination "id=${{ steps.sim.outputs.iphone }}" \
            clean test 2>&1 | tee /tmp/build-iphone.log | tail -120

      # CLAUDE.md 的验收标准是「零 error 零 warning」，但过去 CI 只看退出码，
      # 于是零警告全靠人在本机手工 grep 维持，带 warning 的 PR 能顺利合进 main。
      # 这里把它变成门禁：只统计本仓源码的警告，不管 SDK/工具链的。
      - name: 零警告门禁
        run: |
          if grep -E "^/Users/runner/work/.*/(BubuTimeMachine|BubuWatch|BubuWidgets|WatchShared)[^:]*:[0-9]+:[0-9]+: warning:" /tmp/build-iphone.log | sort -u > /tmp/warnings.txt && [ -s /tmp/warnings.txt ]; then
            echo "::error::本仓源码出现编译警告，验收标准是零 warning："
            cat /tmp/warnings.txt
            exit 1
          fi
          echo "零警告 ✅"

      # iPad 横屏回归此前从未在自动化里跑过：唯一的 iPad 用例靠 XCTSkipUnless(idiom == .pad)
      # 自我跳过，而上面的模拟器选择只挑 iPhone，于是它永远 skip。
      # UI 测试在共享 runner 上会因为资源竞争偶发超时。
      # 失败一次就重跑一次：真的坏了会连挂两次，偶发抖动则自愈。
      # 不用 continue-on-error——那等于把门禁降级成摆设。
      - name: UI 回归 (iPad)
        if: steps.sim.outputs.ipad != ''
        run: |
          set -o pipefail
          xcodebuild -project BubuTimeMachine.xcodeproj \
            -scheme BubuTimeMachine \
            -destination "id=${{ steps.sim.outputs.ipad }}" \
            -only-testing:BubuTimeMachineUITests \
            test 2>&1 | tee /tmp/ipad.log | tail -80 \
          || {
            echo "iPad 回归第一次失败，重跑一次以排除 runner 资源抖动"
            xcodebuild -project BubuTimeMachine.xcodeproj \
              -scheme BubuTimeMachine \
              -destination "id=${{ steps.sim.outputs.ipad }}" \
              -only-testing:BubuTimeMachineUITests \
              test 2>&1 | tee /tmp/ipad.log | tail -80
          }

      # tail -80 会把断言细节截掉，失败时看不出是哪一条炸的。
      - name: iPad 失败详情
        if: failure()
        run: |
          grep -E "error:|XCTAssert|Failing tests|Test Case .* failed" /tmp/ipad.log | tail -40 || true

  server:
    name: AI server tests (Python 3.9)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: Install deps
        working-directory: server/ai
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        working-directory: server/ai
        # `python -m` 会把当前服务目录加入模块搜索路径；直接调用 pytest 的
        # console script 在 GitHub Python 3.9 环境下无法 import movie_render。
        run: python -m pytest tests -q

      - name: PocketBase migration and isolation integration tests
        # 与当前生产版本一致，独立临时数据库验证真实规则，不读取家庭数据。
        run: |
          curl -fsSL --retry 3 https://github.com/pocketbase/pocketbase/releases/download/v0.39.2/pocketbase_0.39.2_linux_amd64.zip -o /tmp/pocketbase.zip
          echo '054cdf8c52712c4fcab1c515f0e4d9cc0e31d4f4f3bd81d8455b663178e2f146  /tmp/pocketbase.zip' | sha256sum -c -
          unzip -q /tmp/pocketbase.zip -d /tmp/bubu-pocketbase
          POCKETBASE_BIN=/tmp/bubu-pocketbase/pocketbase python -m unittest discover -s server/pocketbase/tests -v
