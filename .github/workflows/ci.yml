# BubuTimeMachine CI：iOS 构建+测试、AI 服务端测试
# 注意：iOS 工程 deploymentTarget 为 iOS 26，需要带 Xcode 26 的 macos-26 镜像；
# 若仓库所在账号暂无该 runner 镜像，可临时把 ios job 的 runs-on 调整为可用版本并 pin Xcode。
name: CI

on:
  push:
    branches: [main, audit/five-round-product-20261004, audit/three-round-safety-20261001]
  pull_request:

# Test-only workflow: no deployment, production credentials or write-capable token.
permissions:
  contents: read

jobs:
  harmony-policy:
    name: HarmonyOS repository gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Reject signing material and stale parity metadata
        run: bash harmony/scripts/check-repository-hygiene.sh
      - name: Test pure HarmonyOS sync contracts
        run: node --test harmony/tests/*.test.mjs

  ios:
    name: iOS build & test (Xcode 26, ${{ matrix.device }})
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      # Each simulator gets its own runner and full time budget. An iPhone failure
      # must not cancel iPad evidence or leave two simulators competing for memory.
      fail-fast: false
      matrix:
        device: [iPhone, iPad]
    steps:
      - name: Start bounded validation clock
        timeout-minutes: 1
        run: echo "BUBU_CI_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        timeout-minutes: 2

      - name: Reject duplicate source copies
        timeout-minutes: 1
        run: bash scripts/check-duplicate-source-files.sh

      - name: Test bounded executor and complete coverage gates
        timeout-minutes: 1
        run: |
          set -o pipefail
          python3 -m unittest discover -s scripts -p test_native_ci.py -v 2>&1 | tee /tmp/native-ci-selftest.log
          python3 scripts/select-ui-retries.py --self-test

      - name: Select latest Xcode 26
        timeout-minutes: 1
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version

      - name: Install xcodegen
        timeout-minutes: 5
        run: brew install xcodegen ffmpeg

      - name: Generate project
        timeout-minutes: 1
        run: xcodegen generate

      - name: Use synthetic migration fixtures
        timeout-minutes: 1
        run: |
          python3 - <<'PYTHON'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          path = Path("BubuTimeMachine.xcodeproj/xcshareddata/xcschemes/BubuTimeMachine.xcscheme")
          tree = ET.parse(path)
          action = tree.getroot().find("TestAction")
          variables = action.find("EnvironmentVariables")
          if variables is None:
              variables = ET.SubElement(action, "EnvironmentVariables")
          ET.SubElement(variables, "EnvironmentVariable", {
              "key": "BUBU_SYNTHETIC_MIGRATION_FIXTURE", "value": "1", "isEnabled": "YES"})
          tree.write(path, encoding="utf-8", xml_declaration=True)
          PYTHON

      - name: Pick isolated simulator
        timeout-minutes: 2
        id: sim
        env:
          BUBU_CI_DEVICE: ${{ matrix.device }}
        run: |
          SIMULATOR=$(xcrun simctl list devices available -j | python3 -c '
          import json,os,sys
          kind = os.environ["BUBU_CI_DEVICE"]
          data = json.load(sys.stdin)
          devices = [d for devs in data["devices"].values() for d in devs if kind in d["name"]]
          print(devices[-1]["udid"] if devices else "")')
          if [ -z "$SIMULATOR" ]; then echo "No available $BUBU_CI_DEVICE simulator"; exit 1; fi
          echo "device=$SIMULATOR" >> "$GITHUB_OUTPUT"

      - name: Clean build for testing
        id: build
        timeout-minutes: 8
        run: |
          set -o pipefail
          mkdir -p /tmp/bubu-native-results /tmp/bubu-ui-attempts
          xcodebuild -project BubuTimeMachine.xcodeproj \
            BUBU_DEFAULT_BASE_URL=https://bubu-test.invalid \
            BUBU_DEFAULT_AI_BASE_URL=https://bubu-test.invalid \
            -scheme BubuTimeMachine \
            -parallel-testing-enabled NO \
            -destination "id=${{ steps.sim.outputs.device }}" \
            clean build-for-testing 2>&1 | tee /tmp/build.log

      - name: Unit tests (iPhone)
        timeout-minutes: 8
        if: matrix.device == 'iPhone'
        run: |
          set -o pipefail
          python3 scripts/run-bounded.py --seconds 420 --grace-seconds 30 \
            --record /tmp/bubu-ui-attempts/unit-command.json -- \
            xcodebuild -project BubuTimeMachine.xcodeproj \
            BUBU_DEFAULT_BASE_URL=https://bubu-test.invalid \
            BUBU_DEFAULT_AI_BASE_URL=https://bubu-test.invalid \
            -scheme BubuTimeMachine \
            -parallel-testing-enabled NO \
            -destination "id=${{ steps.sim.outputs.device }}" \
            -resultBundlePath /tmp/bubu-native-results/unit.xcresult \
            -skip-testing:BubuTimeMachineUITests \
            test-without-building 2>&1 | tee /tmp/unit.log

      - name: 零警告门禁
        id: warnings
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 1
        run: |
          if grep -E "^/Users/runner/work/.*/(BubuTimeMachine|BubuWatch|BubuWidgets|WatchShared)[^:]*:[0-9]+:[0-9]+: warning:" /tmp/build.log | sort -u > /tmp/warnings.txt && [ -s /tmp/warnings.txt ]; then
            echo "::error::本仓源码出现编译警告，验收标准是零 warning："
            cat /tmp/warnings.txt
            exit 1
          fi
          echo "零警告 ✅"

      - name: Boot the selected simulator before timed UI execution
        id: ready
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.warnings.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          python3 scripts/run-bounded.py --seconds 240 --grace-seconds 10 \
            --record /tmp/bubu-ui-attempts/simulator-boot.json -- \
            xcrun simctl bootstatus "${{ steps.sim.outputs.device }}" -b

      - name: Focused natural capture failure and retry journey
        id: focused
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        timeout-minutes: 12
        run: |
          set -o pipefail
          python3 scripts/run-bounded.py --seconds 600 --grace-seconds 30 \
            --record /tmp/bubu-ui-attempts/focused-command.json -- \
            xcodebuild -project BubuTimeMachine.xcodeproj \
            BUBU_DEFAULT_BASE_URL=https://bubu-test.invalid \
            BUBU_DEFAULT_AI_BASE_URL=https://bubu-test.invalid \
            -scheme BubuTimeMachine \
            -parallel-testing-enabled NO \
            -destination "id=${{ steps.sim.outputs.device }}" \
            -resultBundlePath /tmp/bubu-native-results/focused.xcresult \
            -only-testing:BubuTimeMachineUITests/BubuTimeMachineUITests/testNaturalCaptureCancelThenSaveReturnsToTimeline \
            test-without-building 2>&1 | tee /tmp/ui-focused.log
          python3 scripts/select-ui-retries.py --validate-only --device '${{ matrix.device }}' \
            --source BubuTimeMachineUITests/BubuTimeMachineUITests.swift \
            --only-case testNaturalCaptureCancelThenSaveReturnsToTimeline \
            --first-log /tmp/ui-focused.log --output /tmp/bubu-ui-attempts/focused

      - name: Prepare synthetic PhotosPicker assets
        id: photos
        # A focused failure remains red but must not suppress the complete suite.
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        timeout-minutes: 10
        run: bash scripts/prepare-school-picker-fixtures.sh "${{ steps.sim.outputs.device }}"

      - name: Reserve failure evidence time
        id: budget
        if: ${{ !cancelled() && steps.photos.outcome == 'success' }}
        timeout-minutes: 1
        run: |
          python3 - <<'PYTHON'
          import math, os, time
          elapsed = math.ceil((time.time() - int(os.environ["BUBU_CI_STARTED_AT"])) / 60)
          # Two minutes cover job setup/rounding; ten cover a stable snapshot, export, image upload and raw-result preservation.
          minutes = min(36, 60 - 2 - 10 - elapsed)
          if minutes < 1:
              raise SystemExit("Validation budget exhausted before UI; preserving earlier evidence")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"minutes={minutes}\n")
          print(f"UI has {minutes} minutes; diagnostic time remains reserved")
          PYTHON

      - name: UI 回归 (${{ matrix.device }})
        id: ui
        if: ${{ !cancelled() && steps.budget.outcome == 'success' }}
        # Leave time for evidence export even when a simulator stalls.
        timeout-minutes: ${{ fromJSON(steps.budget.outputs.minutes) }}
        run: |
          set -o pipefail
          # The wrapper gets interrupted before the step limit, with time to finish
          # the xcresult. A retry shares this deadline; it cannot restart the clock.
          UI_DEADLINE=$(( $(date +%s) + ${{ steps.budget.outputs.minutes }} * 60 - 45 ))
          python3 scripts/run-bounded.py --deadline-epoch "$UI_DEADLINE" --grace-seconds 30 \
            --record /tmp/bubu-ui-attempts/full-first-command.json -- \
            xcodebuild -project BubuTimeMachine.xcodeproj \
            BUBU_DEFAULT_BASE_URL=https://bubu-test.invalid \
            BUBU_DEFAULT_AI_BASE_URL=https://bubu-test.invalid \
            -scheme BubuTimeMachine \
            -parallel-testing-enabled NO \
            -destination "id=${{ steps.sim.outputs.device }}" \
            -resultBundlePath /tmp/bubu-native-results/full-first.xcresult \
            -only-testing:BubuTimeMachineUITests \
            test-without-building 2>&1 | tee /tmp/ui-first.log \
          || {
            echo "had_retry=true" >> "$GITHUB_OUTPUT"
            echo "UI 首次失败：保留完整第一次结果，只重试明确失败且已执行的用例"
            python3 scripts/select-ui-retries.py --self-test
            python3 scripts/select-ui-retries.py --device '${{ matrix.device }}' \
              --source BubuTimeMachineUITests/BubuTimeMachineUITests.swift \
              --first-log /tmp/ui-first.log --output /tmp/bubu-ui-attempts || exit 1
            RETRY=()
            while IFS= read -r test; do
              RETRY+=("-only-testing:BubuTimeMachineUITests/BubuTimeMachineUITests/$test")
            done < /tmp/bubu-ui-attempts/retry-tests.txt
            [ "${#RETRY[@]}" -gt 0 ] || exit 1
            retry_status=0
            python3 scripts/run-bounded.py --deadline-epoch "$UI_DEADLINE" --grace-seconds 30 \
              --record /tmp/bubu-ui-attempts/full-retry-command.json -- \
              xcodebuild -project BubuTimeMachine.xcodeproj \
              BUBU_DEFAULT_BASE_URL=https://bubu-test.invalid \
              BUBU_DEFAULT_AI_BASE_URL=https://bubu-test.invalid \
              -scheme BubuTimeMachine \
              -parallel-testing-enabled NO \
              -destination "id=${{ steps.sim.outputs.device }}" \
              -resultBundlePath /tmp/bubu-native-results/full-retry.xcresult \
              "${RETRY[@]}" \
              test-without-building 2>&1 | tee /tmp/ui-retry.log || retry_status=$?
            python3 scripts/select-ui-retries.py --device '${{ matrix.device }}' \
              --source BubuTimeMachineUITests/BubuTimeMachineUITests.swift \
              --first-log /tmp/ui-first.log --retry-log /tmp/ui-retry.log \
              --output /tmp/bubu-ui-attempts || exit 1
            [ "$retry_status" -eq 0 ] || exit "$retry_status"
          }
          if [ ! -f /tmp/ui-retry.log ]; then
            python3 scripts/select-ui-retries.py --validate-only --device '${{ matrix.device }}' \
              --source BubuTimeMachineUITests/BubuTimeMachineUITests.swift \
              --first-log /tmp/ui-first.log --output /tmp/bubu-ui-attempts
          fi

      - name: Snapshot native result files after command completion
        if: ${{ always() }}
        timeout-minutes: 1
        run: |
          python3 scripts/snapshot-native-results.py \
            --source /tmp/bubu-native-results --destination /tmp/bubu-result-snapshot

      - name: Preserve synthetic simulator evidence
        if: ${{ always() }}
        timeout-minutes: 4
        continue-on-error: true
        run: |
          mkdir -p /tmp/bubu-ci-diagnostics
          cp /tmp/bubu-ui-attempts/*.json /tmp/bubu-ui-attempts/*.txt /tmp/bubu-ci-diagnostics/ 2>/dev/null || true
          cp /tmp/bubu-ui-attempts/focused/attempt-summary.json /tmp/bubu-ci-diagnostics/focused-attempt-summary.json 2>/dev/null || true
          cp /tmp/build.log /tmp/unit.log /tmp/ui-first.log /tmp/ui-retry.log /tmp/ui-focused.log /tmp/native-ci-selftest.log /tmp/bubu-ci-diagnostics/ 2>/dev/null || true
          cp /tmp/bubu-result-snapshot/snapshot-status.json /tmp/bubu-ci-diagnostics/ 2>/dev/null || true
          python3 - <<'PYTHON'
          from pathlib import Path
          import subprocess, time, json
          root = Path("/tmp/bubu-result-snapshot")
          output = Path("/tmp/bubu-ci-diagnostics")
          export = ["xcrun", "xcresulttool", "export", "attachments"]
          deadline = time.monotonic() + 205
          records = []
          results = sorted(root.glob("*.xcresult"), key=lambda p: p.stat().st_mtime, reverse=True)
          # Export failures first: a large successful screenshot set previously consumed
          # the full per-bundle budget before any failed onboarding/star evidence.
          for result in results:
              if not (result / "Info.plist").exists():
                  records.append({"bundle": result.name, "incomplete": True})
                  continue
              for action, command, budget in [
                  ("summary", ["xcrun", "xcresulttool", "get", "test-results", "summary", "--path", str(result)], 12),
                  ("tests", ["xcrun", "xcresulttool", "get", "test-results", "tests", "--path", str(result)], 12),
                  ("failures", export + ["--path", str(result), "--output-path", str(output / (result.stem + "-failures")), "--only-failures"], 40),
              ]:
                  remaining = min(budget, deadline - time.monotonic())
                  if remaining <= 0: break
                  suffix = ".log" if action == "failures" else ".json"
                  with (output / (result.stem + "-" + action + suffix)).open("w") as log:
                      try:
                          proc = subprocess.run(command, stdout=log, stderr=subprocess.STDOUT, check=False, timeout=remaining)
                          records.append({"bundle": result.name, "action": action, "exit": proc.returncode})
                      except subprocess.TimeoutExpired:
                          records.append({"bundle": result.name, "action": action, "timed_out": True})
          for result in results:
              remaining = min(90, deadline - time.monotonic())
              if remaining <= 0: break
              if not (result / "Info.plist").exists(): continue
              try:
                  proc = subprocess.run(export + ["--path", str(result), "--output-path", str(output / result.stem)],
                                        check=False, timeout=remaining)
                  records.append({"bundle": result.name, "action": "all_attachments", "exit": proc.returncode})
              except subprocess.TimeoutExpired:
                  records.append({"bundle": result.name, "action": "all_attachments", "timed_out": True})
          (output / "attachment-export-status.json").write_text(json.dumps(records, indent=2))
          PYTHON
          for log in /tmp/build.log /tmp/unit.log /tmp/ui-first.log /tmp/ui-retry.log /tmp/ui-focused.log; do
            if [ -f "$log" ]; then
              grep -E "error:|XCTAssert|Failing tests|Test Case .* failed|PhotosPicker failure" "$log" | tail -60 || true
            fi
          done

      - name: Upload synthetic simulator evidence
        timeout-minutes: 2
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-${{ matrix.device }}-evidence-${{ github.sha }}
          # Keep screenshots, accessibility text and logs readable without large recordings.
          path: |
            /tmp/bubu-ci-diagnostics/**/*.png
            /tmp/bubu-ci-diagnostics/**/*.jpg
            /tmp/bubu-ci-diagnostics/**/*.jpeg
            /tmp/bubu-ci-diagnostics/**/*.txt
            /tmp/bubu-ci-diagnostics/**/*.json
            /tmp/bubu-ci-diagnostics/*.log
          retention-days: 3
          if-no-files-found: warn

      - name: Preserve raw synthetic native test results
        timeout-minutes: 3
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-${{ matrix.device }}-xcresults-${{ github.sha }}
          path: |
            /tmp/bubu-result-snapshot/*.xcresult
            /tmp/bubu-result-snapshot/snapshot-status.json
          retention-days: 3
          if-no-files-found: warn

  server:
    name: AI server tests (Python 3.9)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: Install deps
        working-directory: server/ai
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        working-directory: server/ai
        # `python -m` 会把当前服务目录加入模块搜索路径；直接调用 pytest 的
        # console script 在 GitHub Python 3.9 环境下无法 import movie_render。
        run: python -m pytest tests -q

      - name: PocketBase migration and isolation integration tests
        # 与当前生产版本一致，独立临时数据库验证真实规则，不读取家庭数据。
        run: |
          curl -fsSL --retry 3 https://github.com/pocketbase/pocketbase/releases/download/v0.39.2/pocketbase_0.39.2_linux_amd64.zip -o /tmp/pocketbase.zip
          echo '054cdf8c52712c4fcab1c515f0e4d9cc0e31d4f4f3bd81d8455b663178e2f146  /tmp/pocketbase.zip' | sha256sum -c -
          unzip -q /tmp/pocketbase.zip -d /tmp/bubu-pocketbase
          POCKETBASE_BIN=/tmp/bubu-pocketbase/pocketbase python -m unittest discover -s server/pocketbase/tests -v

  watch-product-audit:
    name: Native Watch photo reading (synthetic IO)
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select Xcode and install project generator
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          command -v xcodegen >/dev/null || brew install xcodegen
      - name: Capture actual watchOS production view
        run: |
          bash scripts/watch-product-audit/run.sh baseline 274df2d27508645a0a95cedabd0d76794774f5bb
          bash scripts/watch-product-audit/run.sh current WORKTREE
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: native-watch-product-${{ github.sha }}
          path: |
            watch-product-audit-results/**/*.png
            watch-product-audit-results/**/*.json
            watch-product-audit-results/**/*.txt
            watch-product-audit-results/**/*.log
          retention-days: 14
          if-no-files-found: error
